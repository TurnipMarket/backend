
services:
  mysql:
    image: mysql:8.0
    container_name: mi_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mi_password_super_seguro
      MYSQL_DATABASE: mi_base_de_datos
      MYSQL_USER: mi_usuario
      MYSQL_PASSWORD: mi_password_usuario
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Opcional: Si quieres cargar un script SQL inicial al crear el contenedor
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql 

volumes:
  mysql_data:
    driver: local
