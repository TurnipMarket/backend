services:
  backend:
    build: .
    container_name: turnip-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # La base SQLite y las fotos de productos (data/uploads) viven en el volumen.
      # El código lee DATABASE_PATH (no DATABASE_URL).
      - DATABASE_PATH=/app/data/turnip.db
    volumes:
      - turnip_data:/app/data
    restart: unless-stopped

volumes:
  turnip_data: